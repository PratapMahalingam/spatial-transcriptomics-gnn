name: smoke

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CPU-only PyTorch, then the rest
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Unit tests
        run: pytest -q
      - name: Synthetic end-to-end run (not real data)
        run: python run_experiment.py --synthetic --seeds 1 --max-epochs 40 --out /tmp/synthetic_smoke
